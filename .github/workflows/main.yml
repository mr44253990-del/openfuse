
name: OpenFuse Android APK Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install pnpm BEFORE setup-node cache
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          node --version
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Expo Prebuild
        run: |
          pnpm --dir apps/mobile exec expo prebuild \
            --platform android \
            --non-interactive

      - name: Build Debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found!"
            find apps/mobile/android -name "*.apk"
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/OpenFuse-Android.apk
          ls -lh release/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFuse-Android-APK
          path: release/OpenFuse-Android.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: OpenFuse Android ${{ github.run_number }}
          body: |
            # OpenFuse Android APK

            Automatically generated Android APK.

            Build: Debug
            Platform: Android
            Source: apps/mobile

          files: release/OpenFuse-Android.apk
          fail_on_unmatched_files: true
          make_latest: true
          
